<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 340" role="img" aria-label="PadelArena">
  <defs>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="balle" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#EEFF8A"/><stop offset=".5" stop-color="#C8E64A"/><stop offset="1" stop-color="#7DA60A"/>
    </radialGradient>
  </defs>
  <!-- Carré néon vert derrière la balle, carré néon rouge derrière la fin d'« Arena » : halo flou puis trait net. -->
  <g transform="rotate(-12 180 170)" fill="none">
    <rect x="58" y="48" width="244" height="244" rx="12" stroke="#B6DC16" stroke-width="16" opacity=".45" filter="url(#halo)"/>
    <rect x="58" y="48" width="244" height="244" rx="12" stroke="#9CC40C" stroke-width="7"/>
  </g>
  <g transform="rotate(14 1110 200)" fill="none">
    <rect x="1010" y="100" width="200" height="200" rx="12" stroke="#FF4D5A" stroke-width="16" opacity=".4" filter="url(#halo)"/>
    <rect x="1010" y="100" width="200" height="200" rx="12" stroke="#E5323F" stroke-width="7"/>
  </g>
  <circle cx="180" cy="170" r="80" fill="url(#balle)" stroke="#0E1B2C" stroke-width="6"/>
  <path d="M124 110C156 140 156 200 124 230M236 110C204 140 204 200 236 230" fill="none" stroke="#0E1B2C" stroke-width="8" stroke-linecap="round"/>
  <text x="272" y="222" textLength="880" lengthAdjust="spacingAndGlyphs" font-family="'Segoe UI', Arial, sans-serif" font-size="150" font-weight="900" font-style="italic">
    <tspan fill="#0E1B2C">Padel</tspan><tspan fill="#B6DC16" stroke="#0E1B2C" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Arena</tspan>
  </text>
</svg>
