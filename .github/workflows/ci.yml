name: CI

# Contrôle chaque fusion vers develop ou main, et chaque demande de fusion.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Style et lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          npm ci

      - name: Style PHP (Pint)
        run: vendor/bin/pint --test

      - name: Format du front (Prettier)
        run: npm run format:check

      - name: Lint du front (ESLint)
        run: npx eslint .

  tests:
    name: Tests (PHPUnit sur PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: padelarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql, pgsql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Construction du front
        run: npm run build

      - name: Environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: vendor/bin/phpunit
